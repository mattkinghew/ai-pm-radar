<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee"><link rel="manifest" href="/manifest.webmanifest">
<title>AI PM Radar</title><link rel="stylesheet" href="/app.css"></head><body>
<header><h1>AI PM <span>Radar</span></h1><span id="cap" aria-label="今日 AI 用量"></span></header>
<nav><button data-tab="daily" class="on">今日</button><button data-tab="draft">待審核</button><button data-tab="approved">知識庫</button><button data-tab="sources">訊息源</button><button data-tab="capture">＋ 擷取</button></nav>
<div id="lang"><button data-lang="zh">中文</button><button data-lang="both">中英對照</button><button data-lang="orig">原文</button></div>
<main id="view"></main>
<template id="capture-tpl"><form id="cap-form">
<label>網址<input name="url" type="url" placeholder="https://…"></label>
<label>正文 / 字幕 / 貼文<textarea name="text" rows="8" placeholder="影片或社交貼文請直接貼字幕或內容"></textarea></label>
<button type="submit">AI 整理成知識文章</button><p id="cap-msg" role="status"></p></form></template>
<template id="sources-tpl"><form id="src-form" class="panel"><div class="row"><label>類型<select name="type"><option value="rss">RSS</option><option value="x">X 帳號</option></select></label>
<label class="grow">網址 / @handle<input name="value" required placeholder="https://… 或 @handle"></label></div>
<label>名稱（可選）<input name="label" maxlength="60"></label><button type="submit">新增訊息源</button><p id="src-msg" role="status"></p></form><div id="src-list"></div></template>
<script src="/app.js" type="module"></script></body></html>
