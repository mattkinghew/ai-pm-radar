<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee"><link rel="manifest" href="/manifest.webmanifest">
<title>AI PM Radar</title><link rel="stylesheet" href="/app.css"></head><body>
<header><h1>AI PM <span>Radar</span></h1><span id="cap" aria-label="今日 AI 用量"></span></header>
<nav><button data-tab="daily" class="on">今日</button><button data-tab="digest">今日晨報</button><button data-tab="draft">待審核</button><button data-tab="later">稍後讀</button><button data-tab="kb">知識庫</button><button data-tab="sources">訊息源</button><button data-tab="capture">＋ 擷取</button></nav>
<div id="lang"><button data-lang="zh">中文</button><button data-lang="both">中英對照</button><button data-lang="orig">原文</button></div>
<main id="view"></main>
<template id="capture-tpl"><form id="cap-form">
<label>網址<input name="url" type="url" placeholder="https://…"></label>
<label>標題（可選）<input name="title" maxlength="240"></label>
<label>原文語言（由你確認）<select name="source_language"><option value="unknown">未知</option><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">簡體中文</option></select></label>
<label>正文 / 字幕 / 貼文<textarea name="text" rows="8" placeholder="短內容或 URL 會先存為待核對，不會呼叫 AI"></textarea></label>
<button type="submit">存入待審核</button><p id="cap-msg" role="status"></p></form><details class="panel"><summary>批量匯入 SourceInput JSON（最多 100 筆）</summary><textarea id="inbox-json" rows="8" placeholder='貼上 SourceInput 陣列 JSON'></textarea><button id="inbox-import">匯入到私人 Inbox</button><p id="inbox-import-msg" role="status"></p></details></template>
<template id="sources-tpl"><section class="panel" aria-label="來源健康"><h2>來源清單與上次檢查</h2><div id="source-health">載入中…</div></section><form id="src-form" class="panel"><div class="row"><label>類型<select name="type"><option value="rss">RSS</option><option value="x">X 帳號</option><option value="github_search">GitHub 搜尋</option><option value="github_releases">GitHub Releases</option><option value="youtube_channel">YouTube 官方 Atom</option></select></label>
<label class="grow">網址 / @handle<input name="value" required placeholder="https://… 或 @handle"></label></div>
<label>Lane<select name="lane_default"><option>OTHER</option><option>AI_LEARNING_PATH</option><option>MONETIZATION_GAP</option><option>TECH_NEWS</option><option>GITHUB_PROJECT</option><option>APPLY_NOW</option><option>FREE_RESOURCE</option><option>AGENT_GOVERNANCE</option><option>CONTENT_WORKFLOW</option></select></label>
<div class="row"><label>來源權重 (-2 至 2)<input name="weight" type="number" min="-2" max="2" value="0"></label><label>每日上限<input name="max_per_day" type="number" min="1" max="100" value="5"></label></div>
<label>包含關鍵字（逗號分隔）<input name="include_keywords"></label><label>排除關鍵字（逗號分隔）<input name="exclude_keywords"></label><label><input name="ai_eligible" type="checkbox" value="true">允許進入每日 AI 自動分析候選（仍受現有上限）</label>
<button type="submit">新增訊息源</button><p id="src-msg" role="status"></p></form><details class="panel bulk" id="source-import"><summary>匯入多個來源（文字／OPML／CSV）</summary><p class="meta">最多 100 項、每份 1 MB。文字可輸入 RSS、@handle、owner/repo、YouTube UC channel ID，或 github_search: 查詢。模糊輸入會標示需人工指定類型；預覽不新增來源、不呼叫 AI，也不讀取郵件。</p><label>格式<select id="source-import-format"><option value="text">多行文字</option><option value="opml">OPML</option><option value="csv">CSV</option></select></label><label>檔案（可選）<input id="source-import-file" type="file" accept=".txt,.opml,.xml,.csv"></label><label>內容<textarea id="source-import-content" rows="7" placeholder="RSS URL、@handle、owner/repo、YouTube UC… 或 github_search: query"></textarea></label><div id="source-import-mapping"></div><button id="source-import-preview">預覽及驗證</button><div id="source-import-preview-out" role="status"></div><button id="source-import-confirm" disabled>確認匯入一次</button><div id="source-import-job" role="status"></div></details><details class="panel bulk" id="bulk-src"><summary>批量新增訊息源</summary><p class="meta">每行一個：RSS／網站網址、<code>@handle</code>、<code>owner/repo</code>、YouTube channel ID 或 <code>github_search: 查詢</code>。模糊來源會標示需人工指定類型；<code>#</code> 開頭當註解。最多 100 行，不使用 AI 額度。</p><textarea rows="7" aria-label="批量訊息源" placeholder="https://simonwillison.net/atom/everything/&#10;https://www.latent.space&#10;@karpathy&#10;owner/repo&#10;UCabcdefghijklmnopqrstuvwxyz123456"></textarea><div class="row"><button data-bulk="preview">預覽及檢查</button></div><div id="bulk-out" role="status"></div></details><div id="src-list"></div><h2 class="sub">靜音</h2><form id="mute-form" class="panel"><div class="row"><label>類型<select name="kind"><option value="keyword">關鍵字</option><option value="topic">題材（類別）</option><option value="handle">X 帳號</option></select></label><label class="grow">值<input name="value" required maxlength="80" placeholder="例如 crypto / X_POST / @handle"></label></div><button type="submit">新增靜音</button><p id="mute-msg" role="status"></p></form><div id="mute-list"></div></template>
<script src="/app.js" type="module"></script></body></html>
