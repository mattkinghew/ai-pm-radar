# AI PM Radar — cloud Worker (Workers + D1 + Cron + static assets)
# No secrets here. Deployed 2026-10-31; OWNER_EMAIL_SHA256 is a hash only.
name = "ai-pm-radar-cloud"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "radar-cloud.lamlab.cc", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ai-pm-radar"
database_id = "fdbc35a5-ba4f-490e-9eeb-33ee80029834"
migrations_dir = "migrations"

[ai]
binding = "AI" # Workers AI, optional fallback only

[triggers]
crons = ["0 0 * * *"] # 00:00 UTC = 08:00 HKT

[vars]
ENVIRONMENT = "production"
CLOUD_ACCESS_REQUIRED = "true"
CF_ACCESS_TEAM_DOMAIN = "https://silent-recipe-9aa6.cloudflareaccess.com"
CF_ACCESS_AUD = "56ad83708fd3876e4c3053a7dafe2fef6b134231f2707f82ac3062d6494093c5"
OWNER_EMAIL_SHA256 = "e9567eff528ea91c6472e28ec186b9a682d88456facceb65c943dc721d9f5ba3"
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
AI_FALLBACK_PROVIDER = "workers-ai" # none | workers-ai
WORKERS_AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8" # 4625 neurons/M in, 30475/M out (pricing page 2026-10-20)
WORKERS_AI_DAILY_CAP = "100" # worst case ~55 neurons/call -> ~5.5k of 10k free neurons/day
AI_DAILY_CAP = "10"
AI_MANUAL_RESERVE_GEMINI = "5"
AI_MANUAL_RESERVE_WORKERS = "20"
AI_AUTO_ANALYZE_LIMIT = "5"
AI_AUTO_ANALYZE_ENABLED = "true"
AI_AUTO_ANALYZE_INCLUDE_TERMS = "一人公司,solopreneur,indie,低成本,變現,副業,訊息差,frontend,react,css,學習,工具,定價,workflow,consultant"
AI_AUTO_ANALYZE_EXCLUDE_TERMS = "羊毛,web3,短劇,政治,地緣政治,情報,intelligence,politics,political,intel,數據中心,data center,data centre"
AI_TARGET_LANGUAGE = "zh-Hant"
# Optional self-hosted RSSHub base; rsshub:// sources stay disabled until this is configured.
# RSSHUB_BASE_URL = "https://rsshub.example.com"
# Optional task routing: set AI_TASK_PROVIDER_TRANSLATE and/or AI_TASK_PROVIDER_READER_SUMMARY
# to "openai-compatible" only after setting OPENAI_COMPAT_BASE_URL (HTTPS),
# OPENAI_COMPAT_MODEL and a positive OPENAI_COMPAT_DAILY_CAP. Keep the API key in
# a Wrangler secret named OPENAI_COMPAT_API_KEY; keyless HTTPS routers may omit it.
# Unset task routes retain the existing Gemini / Workers AI behavior.
AI_TASK_PROVIDER_TRANSLATE = "openai-compatible"
AI_TASK_PROVIDER_READER_SUMMARY = "openai-compatible"
OPENAI_COMPAT_BASE_URL = "https://openrouter.ai/api/v1"
OPENAI_COMPAT_MODEL = "openrouter/free"
OPENAI_COMPAT_DAILY_CAP = "50"
# Secrets (wrangler secret put): GEMINI_API_KEY
# Optional Telegram secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_OWNER_CHAT_ID, TELEGRAM_WEBHOOK_SECRET
